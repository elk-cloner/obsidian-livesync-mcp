    <text class="ann halo" x="1272.0" y="793.0" text-anchor="middle">skills: plugin</text>
    <text class="ann halo" x="1272.0" y="813.0" text-anchor="middle">or zips</text>
    <circle cx="1272.0" cy="699.0" r="15" fill="#7fdbff"/>
    <text class="num" x="1272.0" y="705.0" text-anchor="middle">7</text>
    <rect class="solid" x="1374" y="85.0" width="160" height="150"/>
    <text class="lab" x="1454.0" y="139.0" text-anchor="middle">CHECK</text>
    <text class="code" x="1454.0" y="163.0" text-anchor="middle">doctor.sh</text>
    <text class="ann" x="1454.0" y="183.0" text-anchor="middle">checks the</text>
    <text class="ann" x="1454.0" y="203.0" text-anchor="middle">setup</text>
    <circle cx="1454.0" cy="109.0" r="15" fill="#7fdbff"/>
    <text class="num" x="1454.0" y="115.0" text-anchor="middle">8</text>
    <rect x="1374" y="685.0" width="160" height="150" fill="#0b3d6e"/>
    <rect class="hatch" x="1374" y="685.0" width="160" height="150"/>
    <text class="lab halo" x="1454.0" y="739.0" text-anchor="middle">ASK CLAUDE</text>
