<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="t d">
  <title id="t">Sheet 2 of 3: setup order, in eight numbered steps</title>
  <desc id="d">Eight steps in four lanes: server, vault, devices and Claude. 1 DNS: two A records, you. 2 Google OAuth client, you. 3 bootstrap.sh on the server: secrets, folders, CouchDB and TLS, MCP server, timers, script. 4 Drive backup: rclone config, you, optional. 5 First vault: add-vault.sh &lt;name&gt;, script, and you connect the first device; the schema is seeded. 6 Obsidian device settings: template folder _templates, attachment folder _attachments, you. 7 Claude: the connector in claude.ai and the skills, you. 8 Check: doctor.sh, script, then ask Claude to set up a topic, you.</desc>
  <defs>
    <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .bg { fill: #0b3d6e; }
    .frame { fill: none; stroke: #ffffff; stroke-width: 3; }
    .margin { fill: none; stroke: #ffffff; stroke-width: 1.2; }
    .tick { stroke: #ffffff; stroke-width: 1.2; }
    .lab { font-size: 16px; font-weight: 700; letter-spacing: .05em; }
    .big { font-size: 18px; font-weight: 700; letter-spacing: .05em; }
    .ann { font-size: 14px; fill: #c4e2fb; }
    .code { font-size: 14px; fill: #7fdbff; }
    .zone { font-size: 15px; font-weight: 700; letter-spacing: .16em; fill: #7fdbff; }
    .num { font-size: 16px; font-weight: 700; fill: #0b3d6e; }
    .tbk { font-size: 14px; fill: #c4e2fb; letter-spacing: .08em; }
    .halo { paint-order: stroke; stroke: #0b3d6e; stroke-width: 5px; stroke-linejoin: round; }
    .solid { fill: #0b3d6e; stroke: #ffffff; stroke-width: 2; }
    .hatch { fill: url(#hatch); stroke: #ffffff; stroke-width: 2; }
    .opt { stroke-dasharray: 8 5; }
    .hinge { fill: #0b3d6e; stroke: #7fdbff; stroke-width: 3; }
    .zbox { fill: none; stroke: #7fdbff; stroke-width: 1.4; stroke-dasharray: 10 6; }
    .zin { fill: none; stroke: #c4e2fb; stroke-width: 1.2; stroke-dasharray: 3 5; }
    .w { fill: none; stroke: #ffffff; stroke-width: 2; }
    .c { fill: none; stroke: #7fdbff; stroke-width: 2; }
    .d { stroke-dasharray: 7 5; }
    .life { fill: none; stroke: #c4e2fb; stroke-width: 1.5; stroke-dasharray: 2 6; }
    .dot { fill: #7fdbff; }
    .callout { fill: #0b3d6e; stroke: #7fdbff; stroke-width: 2; }
    </style>
    <pattern id="fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="coarse" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#fine)"/>
      <path d="M100 0H0V100" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#0b3d6e"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-opacity=".32" stroke-width="2"/>
    </pattern>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffffff"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fdbff"/>
    </marker>
  </defs>
