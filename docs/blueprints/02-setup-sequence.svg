    <text class="lab halo" x="180.0" y="139.0" text-anchor="middle">DNS</text>
    <text class="ann halo" x="180.0" y="163.0" text-anchor="middle">two A records</text>
    <text class="code halo" x="180.0" y="183.0" text-anchor="middle">couch.&lt;domain&gt;</text>
    <text class="code halo" x="180.0" y="203.0" text-anchor="middle">mcp.&lt;domain&gt;</text>
    <circle cx="180.0" cy="109.0" r="15" fill="#7fdbff"/>
