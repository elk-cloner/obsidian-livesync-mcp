    <text class="ann halo" x="1090.0" y="563.0" text-anchor="middle">per device:</text>
    <text class="code halo" x="1090.0" y="583.0" text-anchor="middle">_templates</text>
    <text class="code halo" x="1090.0" y="603.0" text-anchor="middle">_attachments</text>
    <circle cx="1090.0" cy="509.0" r="15" fill="#7fdbff"/>
    <text class="num" x="1090.0" y="515.0" text-anchor="middle">6</text>
    <rect x="1192" y="675.0" width="160" height="170" fill="#0b3d6e"/>
    <rect class="hatch" x="1192" y="675.0" width="160" height="170"/>
