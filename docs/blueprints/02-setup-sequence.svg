    <text class="ann halo" x="908.0" y="603.0" text-anchor="middle">upload notes</text>
    <circle cx="908.0" cy="509.0" r="15" fill="#7fdbff"/>
    <text class="num" x="908.0" y="515.0" text-anchor="middle">5</text>
