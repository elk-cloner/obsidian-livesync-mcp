    <text class="ann halo" x="362.0" y="163.0" text-anchor="middle">web client</text>
    <text class="ann halo" x="362.0" y="183.0" text-anchor="middle">id + secret</text>
    <text class="ann halo" x="362.0" y="203.0" text-anchor="middle">into .env</text>
    <circle cx="362.0" cy="109.0" r="15" fill="#7fdbff"/>
    <text class="num" x="362.0" y="115.0" text-anchor="middle">2</text>
    <rect class="solid" x="464" y="70.0" width="160" height="180"/>
    <text class="lab" x="544.0" y="124.0" text-anchor="middle">BOOTSTRAP</text>
    <text class="code" x="544.0" y="148.0" text-anchor="middle">bootstrap.sh</text>
    <text class="ann" x="544.0" y="168.0" text-anchor="middle">secrets, folders</text>
    <text class="ann" x="544.0" y="188.0" text-anchor="middle">couchdb + tls</text>
    <text class="ann" x="544.0" y="208.0" text-anchor="middle">mcp server</text>
    <text class="ann" x="544.0" y="228.0" text-anchor="middle">timers</text>
    <circle cx="544.0" cy="94.0" r="15" fill="#7fdbff"/>
    <text class="num" x="544.0" y="100.0" text-anchor="middle">3</text>
    <rect x="646" y="85.0" width="160" height="150" fill="#0b3d6e"/>
    <rect class="hatch opt" x="646" y="85.0" width="160" height="150"/>
    <text class="lab halo" x="726.0" y="139.0" text-anchor="middle">DRIVE</text>
    <text class="code halo" x="726.0" y="163.0" text-anchor="middle">rclone config</text>
    <text class="ann halo" x="726.0" y="183.0" text-anchor="middle">backup remote</text>
    <text class="ann halo" x="726.0" y="203.0" text-anchor="middle">optional</text>
    <circle cx="726.0" cy="109.0" r="15" fill="#7fdbff"/>
    <text class="num" x="726.0" y="115.0" text-anchor="middle">4</text>
    <rect class="solid" x="828" y="285.0" width="160" height="150"/>
    <text class="lab" x="908.0" y="339.0" text-anchor="middle">FIRST VAULT</text>
