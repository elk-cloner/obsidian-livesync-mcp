<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1486" width="1600" height="1486" role="img" aria-labelledby="t d">
  <title id="t">Sheet 3 of 3: add a vault with add-vault.sh</title>
  <desc id="d">A sequence with three lifelines: you, the server that runs add-vault.sh, and the device that runs Obsidian. You run sudo ./scripts/add-vault.sh &lt;name&gt;. The server creates the database, and the provisioner writes the LiveSync version document. The server prints a Setup URI and a one-time passphrase, and waits. You import the Setup URI on the first device. The device writes the LiveSync settings into the database and uploads its notes. The server sees the device: notes, or a rewritten version document. It waits until the upload is quiet for 30 seconds. It adds the vault to VAULTS, starts the bridge, and the mirror fills. It makes the first history commit and prints the next step, seed-vault.sh. You run seed-vault.sh. The schema goes into the mirror, and the bridge sends the files to the device. Callout: the first device writes the LiveSync settings of the vault, and the bridge reads them. If the bridge connects first, the settings do not match.</desc>
