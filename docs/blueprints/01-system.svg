<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Sheet 1 of 3: system overview of obsidian-livesync-mcp</title>
  <desc id="d">Devices with Obsidian and Self-hosted LiveSync sync end-to-end encrypted notes over HTTPS through Caddy to CouchDB, which has one database per vault. The bridge copies notes between CouchDB and the mirror, /srv/vaults/&lt;vault&gt;, as plain files. The MCP server reads and writes the mirror for Claude, through the connector at mcp.&lt;domain&gt;/mcp, with Google OAuth and one allowed email. Systemd timers copy the mirror to the history (git, every 15 minutes, optional GitHub push), the backup (rclone to Google Drive, nightly) and run the staleness check (hourly). From the repo, seed-vault.sh copies vault/template into the mirror, and skills/ go to Claude.</desc>
