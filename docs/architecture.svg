<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="1120" height="830" viewBox="0 0 1120 830">
  <title id="title">Architecture of obsidian-livesync-mcp: devices and Claude reach CouchDB and the MCP server through Caddy; livesync-bridge mirrors CouchDB into /srv/vaults, which git, backup and the staleness check read.</title>
        <defs>
  <style>
    svg { --bg:#f5f8fc; --grid:rgba(27,58,104,.07); --ink:#1b3a68; --muted:#536d92; --node:#ffffff; --accent:#b9440f; --accent-soft:rgba(185,68,15,.08); color:var(--ink); }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0e2a50; --grid:rgba(190,215,245,.06); --ink:#d6e6fa; --muted:#93acd0; --node:#12345f; --accent:#ff9d6b; --accent-soft:rgba(255,157,107,.1); }
    }
    .bg { fill:var(--bg); } .gridline { stroke:var(--grid); stroke-width:1; }
    text { fill:var(--ink); font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
    .t { font-weight:600; font-size:15px; letter-spacing:.02em; }
    .s { font-size:12px; fill:var(--muted); }
    .m, .lbl { font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; }
    .m { fill:var(--muted); }
    .lbl { paint-order:stroke; stroke:var(--bg); stroke-width:5px; stroke-linejoin:round; }
    .zone { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:600; font-size:11px; letter-spacing:.14em; fill:var(--muted); }
    .node rect { fill:var(--node); stroke:var(--ink); stroke-width:1.4; }
    .node.hinge rect { stroke:var(--accent); stroke-width:2; fill:var(--accent-soft); }
    .node.hinge .t { fill:var(--accent); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:16px; }
    .edge { fill:none; stroke:var(--ink); stroke-width:1.5; }
    .edge.job { stroke-dasharray:5 4; }
    .bound { fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:8 6; }
    .bound.inner { stroke-dasharray:2 4; }
    .arrowhead { fill:var(--ink); }
  </style>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="gridline" d="M20 0 H0 V20" fill="none"/></pattern>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="arrowhead" d="M0 0 L10 5 L0 10 z"/>
          </marker>
        </defs>
        <rect class="bg" width="1120" height="830"/>
        <rect width="1120" height="830" fill="url(#grid)"/>

        <!-- zones -->
        <text class="zone" x="20" y="70">CLIENTS</text>
        <rect class="bound" x="250" y="30" width="630" height="650" rx="6"/>
        <text class="zone" x="266" y="54">VPS · HOST</text>
        <rect class="bound inner" x="272" y="72" width="598" height="290" rx="4"/>
        <text class="m" x="860" y="355" text-anchor="end">docker compose · network "internal"</text>
        <text class="zone" x="920" y="236">IDENTITY</text>
        <text class="zone" x="690" y="775">OFF-SERVER</text>
        <text class="m" x="690" y="792">history + backup</text>

        <!-- edges: two-way sync -->
        <line class="edge" x1="192" y1="135" x2="288" y2="135" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="240" y="126" text-anchor="middle">LiveSync</text>
        <text class="lbl" x="240" y="152" text-anchor="middle">HTTPS</text>

        <line class="edge" x1="192" y1="295" x2="288" y2="295" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="240" y="286" text-anchor="middle">MCP calls</text>
        <text class="lbl" x="240" y="312" text-anchor="middle">HTTPS</text>

        <line class="edge" x1="422" y1="135" x2="488" y2="135" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="455" y="126" text-anchor="middle">couch.*</text>

        <line class="edge" x1="422" y1="295" x2="488" y2="295" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="455" y="286" text-anchor="middle">mcp.*</text>

        <line class="edge" x1="652" y1="135" x2="718" y2="135" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="685" y="126" text-anchor="middle">replicate</text>
        <text class="lbl" x="685" y="152" text-anchor="middle">encrypted</text>

        <line class="edge" x1="790" y1="182" x2="790" y2="408" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="798" y="236">plain .md</text>
        <text class="lbl" x="798" y="252">files</text>

        <line class="edge" x1="570" y1="342" x2="570" y2="408" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="580" y="392">read / write</text>

        <!-- MCP to Google, hopping over the bridge line -->
        <path class="edge" d="M652 295 H780 a10 10 0 0 1 20 0 H918" marker-start="url(#arr)" marker-end="url(#arr)"/>
        <text class="lbl" x="715" y="286" text-anchor="middle">OAuth</text>
        <text class="lbl" x="860" y="286" text-anchor="middle">token</text>

        <!-- edges: scheduled one-way jobs -->
        <line class="edge job" x1="375" y1="492" x2="375" y2="558" marker-end="url(#arr)"/>
        <text class="lbl" x="385" y="530">every 15 min</text>
        <line class="edge job" x1="575" y1="492" x2="575" y2="558" marker-end="url(#arr)"/>
        <text class="lbl" x="585" y="530">nightly 03:30</text>
        <line class="edge job" x1="775" y1="492" x2="775" y2="558" marker-end="url(#arr)"/>
        <text class="lbl" x="785" y="530">hourly</text>

        <line class="edge job" x1="375" y1="652" x2="375" y2="728" marker-end="url(#arr)"/>
        <text class="lbl" x="385" y="708">git push (SSH)</text>
        <line class="edge job" x1="575" y1="652" x2="575" y2="728" marker-end="url(#arr)"/>
        <text class="lbl" x="585" y="708">one-way copy</text>

        <!-- nodes -->
        <g class="node">
          <rect x="20" y="90" width="170" height="90" rx="4"/>
          <text class="t" x="105" y="122" text-anchor="middle">Obsidian apps</text>
          <text class="s" x="105" y="142" text-anchor="middle">iPhone · iPad · Mac · PC</text>
          <text class="m" x="105" y="161" text-anchor="middle">LiveSync plugin</text>
        </g>

        <g class="node">
          <rect x="20" y="250" width="170" height="90" rx="4"/>
          <text class="t" x="105" y="282" text-anchor="middle">Claude</text>
          <text class="s" x="105" y="302" text-anchor="middle">web · iPhone · iPad</text>
          <text class="m" x="105" y="321" text-anchor="middle">custom connector</text>
        </g>

        <g class="node">
          <rect x="290" y="90" width="130" height="250" rx="4"/>
          <text class="t" x="355" y="204" text-anchor="middle">Caddy</text>
          <text class="s" x="355" y="224" text-anchor="middle">TLS + routing</text>
          <text class="m" x="355" y="243" text-anchor="middle">:80 · :443</text>
        </g>

        <g class="node">
          <rect x="490" y="90" width="160" height="90" rx="4"/>
          <text class="t" x="570" y="122" text-anchor="middle">CouchDB</text>
          <text class="s" x="570" y="142" text-anchor="middle">1 database per vault</text>
          <text class="m" x="570" y="161" text-anchor="middle">E2E encrypted</text>
        </g>

        <g class="node">
          <rect x="720" y="90" width="140" height="90" rx="4"/>
          <text class="t" x="790" y="122" text-anchor="middle">livesync-bridge</text>
          <text class="s" x="790" y="142" text-anchor="middle">decrypt ⇄ encrypt</text>
          <text class="m" x="790" y="161" text-anchor="middle">Deno</text>
        </g>

        <g class="node">
          <rect x="490" y="250" width="160" height="90" rx="4"/>
          <text class="t" x="570" y="282" text-anchor="middle">MCP server</text>
          <text class="s" x="570" y="302" text-anchor="middle">8 vault tools</text>
          <text class="m" x="570" y="321" text-anchor="middle">FastMCP · /mcp</text>
        </g>

        <g class="node">
          <rect x="920" y="250" width="180" height="90" rx="4"/>
          <text class="t" x="1010" y="282" text-anchor="middle">Google OAuth</text>
          <text class="s" x="1010" y="302" text-anchor="middle">proves who you are</text>
          <text class="m" x="1010" y="321" text-anchor="middle">1 email allowed</text>
        </g>

        <g class="node hinge">
          <rect x="290" y="410" width="570" height="80" rx="4"/>
          <text class="t" x="575" y="443" text-anchor="middle">/srv/vaults/&lt;vault&gt;/</text>
          <text class="s" x="575" y="467" text-anchor="middle">plain markdown mirror · the hinge everything downstream reads</text>
        </g>

        <g class="node">
          <rect x="290" y="560" width="170" height="90" rx="4"/>
          <text class="t" x="375" y="592" text-anchor="middle">vault-git</text>
          <text class="s" x="375" y="612" text-anchor="middle">commit history</text>
          <text class="m" x="375" y="631" text-anchor="middle">systemd timer</text>
        </g>

        <g class="node">
          <rect x="490" y="560" width="170" height="90" rx="4"/>
          <text class="t" x="575" y="592" text-anchor="middle">vault-backup</text>
          <text class="s" x="575" y="612" text-anchor="middle">rclone sync</text>
          <text class="m" x="575" y="631" text-anchor="middle">systemd timer</text>
        </g>

        <g class="node">
          <rect x="690" y="560" width="170" height="90" rx="4"/>
          <text class="t" x="775" y="592" text-anchor="middle">staleness check</text>
          <text class="s" x="775" y="612" text-anchor="middle">is the mirror moving?</text>
          <text class="m" x="775" y="631" text-anchor="middle">fail → journal</text>
        </g>

        <g class="node">
          <rect x="290" y="730" width="170" height="80" rx="4"/>
          <text class="t" x="375" y="764" text-anchor="middle">GitHub</text>
          <text class="s" x="375" y="784" text-anchor="middle">private repo per vault</text>
        </g>

        <g class="node">
          <rect x="490" y="730" width="170" height="80" rx="4"/>
          <text class="t" x="575" y="764" text-anchor="middle">Google Drive</text>
          <text class="s" x="575" y="784" text-anchor="middle">backup only</text>
        </g>
      </svg>
