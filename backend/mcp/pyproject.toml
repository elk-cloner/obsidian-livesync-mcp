[project]
name = "obsidian-vault-mcp"
version = "1.0.0"
description = "Remote MCP server exposing the self-hosted Obsidian vault mirror to Claude"
requires-python = ">=3.12"
dependencies = [
    # Pinned deliberately: an unattended rebuild must not change the OAuth
    # behaviour the claude.ai connector depends on.
    "fastmcp==4.1.0",
    "py-key-value-aio[disk]==0.4.6",
    "cryptography==50.0.2",
    # For vault_lint.py, copied in from skills/vault-lint/scripts/lint.py.
    "pyyaml==6.0.3",
]

[tool.setuptools]
py-modules = ["server", "vaults"]
