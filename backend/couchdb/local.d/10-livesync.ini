; Self-hosted LiveSync CouchDB configuration.
;
; These values mirror exactly what the upstream provisioner applies over the
; HTTP config API (utils/couchdb/provision.ts in vrtmrz/obsidian-livesync).
; Committing them here means a rebuilt server comes up correct before the
; provisioner has run, and gives a diffable record of what LiveSync needs.
;
; CouchDB also persists runtime config changes into this directory, so after
; running scripts/couchdb-provision.sh you may see the same keys echoed into
; docker.ini. That is expected and harmless.

[couchdb]
; Chunked notes can legitimately produce large documents.
max_document_size = 50000000

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; app://obsidian.md       -- Obsidian desktop
; capacitor://localhost   -- Obsidian iOS/Android
; http://localhost        -- Obsidian mobile webview fallback
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
